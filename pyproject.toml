[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roledock"
version = "0.3.0"
description = "Role-aware, security-first enterprise multi-agent platform (portfolio reconstruction)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "pydantic>=2,<3", "pymupdf>=1.23,<2"]

[project.optional-dependencies]
agent = ["langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4", "openai>=1.75,<3"]
rag = ["qdrant-client>=1.15,<2", "fastembed>=0.6,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
all = ["langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4", "openai>=1.75,<3", "qdrant-client>=1.15,<2", "fastembed>=0.6,<1", "pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
roledock-demo = "roledock.cli:main"
roledock-index = "roledock.rag_cli:main"
roledock-agent = "roledock.agent_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
