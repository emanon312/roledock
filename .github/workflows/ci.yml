name: RoleDock tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m compileall -q src

  integrations:
    runs-on: ubuntu-latest
    env:
      LANGGRAPH_STRICT_MSGPACK: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[all]'
      - name: Qdrant local and LangGraph SQLite integration (no API tokens)
        run: python -m pytest -q tests/test_integrations.py tests/test_qdrant_unit.py tests/test_model_provider.py
